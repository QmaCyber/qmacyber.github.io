<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qma — games for kids</title>
<style>
  :root { --bg: #fbfaf7; --surface: #ffffff; --text: #1f2328; --muted: #5b6470; --accent: #d6336c; --border: #e6e2da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181c; --surface: #1e2126; --text: #e8e6e3; --muted: #a4abb6; --accent: #ff8fb1; --border: #30343b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0.4em 0 0.2em; }
  h2 { font-size: 1.2rem; margin: 1.6em 0 0.4em; }
  a { color: var(--accent); }
  .app { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin: 0.8em 0; }
  .app h3 { margin: 0 0 0.2em; font-size: 1.1rem; }
  .muted { color: var(--muted); font-size: 0.95rem; }
  .todo { background: #fff3bf; color: #5c4400; padding: 0 4px; border-radius: 4px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Qma</h1>
  <p>Simple, calm games for young children. No sign-up, no accounts, no data collection.</p>

  <h2>Games</h2>
  <div class="app">
    <h3>Pop the balloon!</h3>
    <p class="muted">Android · ages 2–5 · <code>com.babygames.balloonpop</code></p>
    <p><a href="balloon-pop/privacy-policy.html">Privacy policy</a></p>
  </div>

  <h2>Contact</h2>
  <p>Email: <span class="todo">TODO(publisher): email</span></p>
</main>
</body>
</html>
